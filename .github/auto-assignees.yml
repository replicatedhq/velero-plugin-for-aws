---
# This assigns a PR to its author
addAssignees: author

reviewers:
  # Default reviewers for the Replicated fork.
  defaults:
    - maintainers

  groups:
    maintainers:
      - divolgin
      - sgalsaleh

options:
  ignore_draft: true
  ignored_keywords:
    - WIP
    - wip
    - DO NOT MERGE
  enable_group_assignment: true
  number_of_reviewers: 2
